<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Color Lab</title>
<style>
  /*
   * Tokens del sistema de marca de Color Lab (variante original, no la
   * aguamarina):
   *   #000000  vacio / lienzo        #0f0f10  obsidiana / tarjeta
   *   #1c1d1f  carbon / controles    #001b33  marino -- "panel del plug-in"
   *   #4a6cf0  senal -- acento       #f0cca4  arena -- acento calido
   *   #ffffff  blanco -- "la accion" #b8babf  niebla -- texto de apoyo
   *   #888b91  ceniza -- terciario
   * Tipografia: Inter (UI) + JetBrains Mono (labels tecnicos). Sin
   * bundlear webfonts: cae a la fuente del sistema si no estan instaladas.
   */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* Este runtime de UXP aplica el estilo NATIVO del boton (pildora gris
     del SO) a cualquier <button> salvo que se pida "appearance: none"
     explicitamente -- a diferencia de un navegador normal. Hallazgo en
     vivo, probando en Premiere real. */
  button {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    font: inherit;
    color: inherit;
    text-align: inherit;
  }
  body {
    margin: 0;
    padding: 16px;
    font-family: "Inter", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    /* Negro -> el acento cromatico unico de la marca (#4a6cf0 "Senal"),
       oscuro de principio a fin (texto blanco sigue legible). */
    background: linear-gradient(160deg, #000000 0%, #0a1430 40%, #1c3a7a 100%);
    background-attachment: fixed;
    color: #ffffff;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 18px;
  }
  .brand img {
    height: 18px;
    width: auto;
    display: block;
  }
  .brand .wordmark {
    font-size: 15px;
    letter-spacing: -0.2px;
  }
  .brand .wordmark b { font-weight: 700; }
  .brand .wordmark span { font-weight: 300; color: #b8babf; }

  section + section {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .section-label {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color: #888b91;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin: 0 0 12px 0;
  }

  /* --- Navegador de Looks: tira de numeros, sin miniaturas ---
     Flexbox + scroll horizontal; nada de CSS Grid ni aspect-ratio (este
     runtime de UXP no soporta bien CSS moderno -- ver notas abajo). */
  #lookStrip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  /* LOS NUMEROS SON <div>, NO <button>, Y ES OBLIGATORIO.
     Este runtime de UXP sigue pintando el fondo nativo del boton aunque se
     le pida "appearance: none" -- con <button> el recuadro salia gris y el
     fondo blanco del seleccionado se quedaba en un simple trazo. Un <div>
     no tiene apariencia nativa que pelear. El rol de boton y el foco de
     teclado se reponen con role/tabindex y un handler de Enter/Espacio en
     main.js.
     Por lo mismo el contorno va en `border` y no en `box-shadow: inset`:
     tampoco esta verificado que este runtime lo soporte. */
  .look-num {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background-color: transparent;
    border: 1px solid rgba(255,255,255,0.18);
    color: #b8babf;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .look-num:hover { border-color: #4a6cf0; color: #ffffff; }
  /* El Look PUESTO va en blanco: es el maximo contraste sobre el fondo
     oscuro y se localiza de un vistazo entre los quince numeros. El azul
     Senal se queda para el hover y el foco de teclado, que son estados
     pasajeros; asi el blanco significa una sola cosa en esta tira. */
  .look-num.selected {
    background-color: #ffffff;
    border-color: #ffffff;
    color: #001b33;
    font-weight: 500;
  }
  .look-num:focus-visible { outline: 2px solid #4a6cf0; outline-offset: 1px; }

  #lookReadout {
    margin-top: 14px;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.4px;
  }
  /* El numero del nombre acompana al color del recuadro seleccionado: si
     se quedara azul, seria el unico resto de un color que ya no significa
     "seleccionado" en ningun otro sitio de la tira. */
  #lookReadout .idx { color: #ffffff; font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; font-weight: 500; margin-right: 8px; }

  /* --- Deslizador de Intensity (construido a mano: el <input type="range">
     nativo se traba al arrastrarlo en este runtime de UXP). Track fino con
     degrade de marca (senal -> arena); una mascara oscura cubre la parte
     todavia no "revelada" a la derecha del thumb. --- */
  .control-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .control-row label {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #888b91;
  }
  .intensity-value {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    font-size: 13px;
    min-width: 30px;
    text-align: right;
    cursor: text;
    border-bottom: 1px dashed transparent;
  }
  .intensity-value:hover,
  .intensity-value:focus {
    border-bottom-color: #4a6cf0;
    outline: none;
  }
  #intensitySlider,
  .basic-slider {
    position: relative;
    height: 20px;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: none;
  }
  /* Los cinco de "Basic Adjustments" van apilados uno tras otro: sin este
     margen, el siguiente control-row quedaria pegado al thumb anterior. */
  .basic-slider { margin-bottom: 14px; }

  #intensitySlider .track,
  .basic-slider .track {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, #203252 0%, #4a6cf0 55%, #f0cca4 100%);
  }
  #intensitySlider .mask,
  .basic-slider .mask {
    position: absolute;
    right: 0;
    height: 2px;
    border-radius: 0 2px 2px 0;
    background: #16233a;
    width: 0%;
  }
  #intensitySlider .thumb,
  .basic-slider .thumb {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    left: 100%;
    transform: translateX(-50%);
    box-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  #intensitySlider.dragging .thumb,
  .basic-slider.dragging .thumb { background: #dfe6ff; }

  /* --- Ruedas de color (Lift / Gamma / Gain) ---
     Todo con <div>: ningun <button> cerca, por el bug de apariencia
     nativa de este runtime (ver la nota de .look-num).
     El anillo de tono usa conic-gradient; si este runtime no lo soporta,
     queda un circulo liso y el control sigue funcionando EXACTAMENTE
     igual -- la posicion del punto es la que manda, no el color de
     fondo. */
  #lggRow { display: flex; gap: 8px; }
  .wheel-cell {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wheel-label {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #888b91;
    margin-bottom: 7px;
  }
  .wheel {
    position: relative;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background-color: #1c1d1f;
    /* EL ORDEN DE ESTOS COLORES VA AL REVES QUE LA RUEDA DE TONO HABITUAL,
       Y ES OBLIGATORIO. conic-gradient avanza EN SENTIDO HORARIO desde las
       12; la matematica de main.js usa angulos matematicos, que avanzan al
       reves. Con el degradado "natural" (rojo, amarillo, verde...) el
       anillo pintaba el verde a la derecha mientras el control lo ponia a
       la izquierda: arrastrar hacia el verde daba magenta. Los primarios
       tienen que caer donde main.js los coloca -- rojo arriba, verde abajo
       a la izquierda, azul abajo a la derecha. */
    background-image: conic-gradient(from 0deg,
      #e8706e, #c97ad8, #6b84d8, #62c2d8, #7fc98c, #d8c074, #e8706e);
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  /* El disco interior apaga el centro del anillo: el color queda como un
     borde de referencia y el centro no compite con el punto blanco. */
  .wheel-disc {
    position: absolute;
    left: 7px; top: 7px; right: 7px; bottom: 7px;
    border-radius: 50%;
    background-color: #0f0f10;
  }
  .wheel-center {
    position: absolute;
    left: 50%; top: 50%;
    width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px;
    border-radius: 50%;
    background-color: rgba(255,255,255,0.22);
  }
  .wheel-dot {
    position: absolute;
    left: 50%; top: 50%;
    width: 12px; height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background-color: #ffffff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }
  .wheel.dragging .wheel-dot { background-color: #dfe6ff; }

  .wheel-master { width: 100%; margin-top: 8px; text-align: center; }
  .wheel-slider { margin-bottom: 4px; }
  /* El master es bipolar: el neutro esta en el centro, asi que su pista no
     lleva el degrade de marca sino una linea lisa. */
  .wheel-slider .track.neutral {
    background: rgba(255,255,255,0.18);
  }
  .wheel-value {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 10px;
    color: #b8babf;
  }
  .wheel-hint {
    margin-top: 12px;
    font-size: 10px;
    color: #888b91;
    line-height: 1.45;
  }

  button {
    width: 100%;
    padding: 9px 0;
    margin-top: 4px;
    border: 0;
    border-radius: 9px;
    background: #1c1d1f;
    color: #ffffff;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  button:hover { background: #26282b; }
  button.primary { background: #ffffff; color: #001b33; box-shadow: none; }
  button.primary:hover { background: #e9edf5; }
  button.subtle {
    background: none;
    color: #b8babf;
    box-shadow: none;
    font-weight: 400;
    padding: 6px 0;
  }
  button.subtle:hover { color: #ffffff; }

  #status {
    margin-top: 10px;
    font-size: 10.5px;
    color: #888b91;
    min-height: 13px;
  }
  #status.error { color: #ff9b8a; }
  #status.warn { color: #f0cca4; }
  #status.ok { color: #ffffff; }

  details#diagnostics summary {
    cursor: pointer;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #888b91;
  }
  #log {
    margin-top: 8px;
    padding: 8px;
    height: 120px;
    overflow-y: auto;
    background: #0f0f10;
    border-radius: 8px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="./assets/brand/colorlab-mark.png" alt="" />
    <span class="wordmark"><b>Color</b><span>Lab</span></span>
  </div>

  <section>
    <div class="section-label">Look</div>
    <div id="lookStrip"></div>
    <div id="lookReadout"><span class="idx" id="lookIndexLabel">01</span><span id="lookNameLabel">Nature</span></div>
  </section>

  <section>
    <div class="control-row">
      <label for="intensitySlider">Intensity</label>
      <span class="intensity-value" id="intensityValue" tabindex="0" title="Haz clic para escribir un valor">100.0</span>
    </div>
    <div id="intensitySlider">
      <div class="track"></div>
      <div class="mask" id="intensityMask"></div>
      <div class="thumb" id="intensityThumb"></div>
    </div>
  </section>

  <section>
    <div class="section-label">Basic Adjustments</div>

    <div class="control-row">
      <label for="exposureSlider">Exposure</label>
      <span class="intensity-value" id="exposureValue" tabindex="0" title="Haz clic para escribir un valor">0.00</span>
    </div>
    <div id="exposureSlider" class="basic-slider">
      <div class="track"></div>
      <div class="mask" id="exposureMask"></div>
      <div class="thumb" id="exposureThumb"></div>
    </div>

    <div class="control-row">
      <label for="contrastSlider">Contrast</label>
      <span class="intensity-value" id="contrastValue" tabindex="0" title="Haz clic para escribir un valor">0.0</span>
    </div>
    <div id="contrastSlider" class="basic-slider">
      <div class="track"></div>
      <div class="mask" id="contrastMask"></div>
      <div class="thumb" id="contrastThumb"></div>
    </div>

    <div class="control-row">
      <label for="temperatureSlider">Temperature</label>
      <span class="intensity-value" id="temperatureValue" tabindex="0" title="Haz clic para escribir un valor">0.0</span>
    </div>
    <div id="temperatureSlider" class="basic-slider">
      <div class="track"></div>
      <div class="mask" id="temperatureMask"></div>
      <div class="thumb" id="temperatureThumb"></div>
    </div>

    <div class="control-row">
      <label for="tintSlider">Tint</label>
      <span class="intensity-value" id="tintValue" tabindex="0" title="Haz clic para escribir un valor">0.0</span>
    </div>
    <div id="tintSlider" class="basic-slider">
      <div class="track"></div>
      <div class="mask" id="tintMask"></div>
      <div class="thumb" id="tintThumb"></div>
    </div>

    <div class="control-row">
      <label for="saturationSlider">Saturation</label>
      <span class="intensity-value" id="saturationValue" tabindex="0" title="Haz clic para escribir un valor">100.0</span>
    </div>
    <div id="saturationSlider" class="basic-slider">
      <div class="track"></div>
      <div class="mask" id="saturationMask"></div>
      <div class="thumb" id="saturationThumb"></div>
    </div>
  </section>

  <section>
    <div class="section-label">Lift / Gamma / Gain</div>
    <div id="lggRow">
      <div class="wheel-cell">
        <div class="wheel-label">Lift</div>
        <div class="wheel" id="liftWheel">
          <div class="wheel-disc"></div>
          <div class="wheel-center"></div>
          <div class="wheel-dot" id="liftDot"></div>
        </div>
        <div class="wheel-master">
          <div id="liftMasterSlider" class="basic-slider wheel-slider">
            <div class="track neutral"></div>
            <div class="mask" id="liftMasterMask"></div>
            <div class="thumb" id="liftMasterThumb"></div>
          </div>
          <span class="wheel-value" id="liftMasterValue">0.00</span>
        </div>
      </div>

      <div class="wheel-cell">
        <div class="wheel-label">Gamma</div>
        <div class="wheel" id="gammaWheel">
          <div class="wheel-disc"></div>
          <div class="wheel-center"></div>
          <div class="wheel-dot" id="gammaDot"></div>
        </div>
        <div class="wheel-master">
          <div id="gammaMasterSlider" class="basic-slider wheel-slider">
            <div class="track neutral"></div>
            <div class="mask" id="gammaMasterMask"></div>
            <div class="thumb" id="gammaMasterThumb"></div>
          </div>
          <span class="wheel-value" id="gammaMasterValue">0.00</span>
        </div>
      </div>

      <div class="wheel-cell">
        <div class="wheel-label">Gain</div>
        <div class="wheel" id="gainWheel">
          <div class="wheel-disc"></div>
          <div class="wheel-center"></div>
          <div class="wheel-dot" id="gainDot"></div>
        </div>
        <div class="wheel-master">
          <div id="gainMasterSlider" class="basic-slider wheel-slider">
            <div class="track neutral"></div>
            <div class="mask" id="gainMasterMask"></div>
            <div class="thumb" id="gainMasterThumb"></div>
          </div>
          <span class="wheel-value" id="gainMasterValue">0.00</span>
        </div>
      </div>
    </div>
    <div class="wheel-hint">Arrastra dentro de la rueda para teñir. Doble clic para volver al centro.</div>
  </section>

  <section>
    <button id="btnApply" class="primary">Aplicar al clip seleccionado</button>
    <div id="status"></div>
  </section>

  <section>
    <details id="diagnostics">
      <summary>Diagnostico</summary>
      <button id="btnDiagnose" class="subtle">Listar efectos y clip seleccionado</button>
      <div id="log"></div>
    </details>
  </section>

  <script src="./main.js"></script>
</body>
</html>

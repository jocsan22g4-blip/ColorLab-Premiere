<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Color Lab (prototipo)</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 12px;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 12px;
    background: #2e2e2e;
    color: #e5e5e5;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 10px 0;
    color: #fafafa;
  }
  .field { margin-bottom: 10px; }
  label { display: block; margin-bottom: 4px; color: #bbb; }
  select, input[type="range"] { width: 100%; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row span { min-width: 34px; text-align: right; color: #ccc; }
  button {
    width: 100%;
    padding: 7px 0;
    margin-top: 4px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #444;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #505050; }
  button.primary { background: #2f6fed; border-color: #2f6fed; }
  button.primary:hover { background: #4b82f2; }
  #log {
    margin-top: 12px;
    padding: 6px;
    height: 180px;
    overflow-y: auto;
    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 4px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .hint { color: #888; font-size: 10.5px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Color Lab — prototipo de viabilidad</h1>

  <div class="field">
    <label for="lookSelect">Look</label>
    <select id="lookSelect"></select>
  </div>

  <div class="field">
    <label for="intensity">Intensity</label>
    <div class="row">
      <input type="range" id="intensity" min="0" max="100" step="0.1" value="100" />
      <span id="intensityValue">100.0</span>
    </div>
  </div>

  <button id="btnDiagnose">1. Diagnosticar (no modifica nada)</button>
  <button id="btnApply" class="primary">2. Aplicar al clip seleccionado</button>

  <div class="hint">
    «Diagnosticar» solo lee: proyecto, secuencia, selección y lista de efectos
    disponibles. «Aplicar» crea el efecto y lo inserta en el clip seleccionado
    (acción deshacible con Cmd/Ctrl+Z).
  </div>

  <div id="log"></div>

  <script src="./main.js"></script>
</body>
</html>

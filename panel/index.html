<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Color Lab</title>
<style>
  /*
   * Tokens del sistema de marca de Color Lab (variante original, no la
   * aguamarina):
   *   #000000  vacio / lienzo        #0f0f10  obsidiana / tarjeta
   *   #1c1d1f  carbon / controles    #001b33  marino -- "panel del plug-in"
   *   #4a6cf0  senal -- acento       #f0cca4  arena -- acento calido
   *   #ffffff  blanco -- "la accion" #b8babf  niebla -- texto de apoyo
   *   #888b91  ceniza -- terciario
   * Tipografia: Inter (UI) + JetBrains Mono (labels tecnicos). Sin
   * bundlear webfonts: cae a la fuente del sistema si no estan instaladas.
   */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* Este runtime de UXP aplica el estilo NATIVO del boton (pildora gris
     del SO) a cualquier <button> salvo que se pida "appearance: none"
     explicitamente -- a diferencia de un navegador normal. Hallazgo en
     vivo, probando en Premiere real. */
  button {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    font: inherit;
    color: inherit;
    text-align: inherit;
  }
  body {
    margin: 0;
    padding: 16px;
    font-family: "Inter", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    /* Negro -> el acento cromatico unico de la marca (#4a6cf0 "Senal"),
       oscuro de principio a fin (texto blanco sigue legible). */
    background: linear-gradient(160deg, #000000 0%, #0a1430 40%, #1c3a7a 100%);
    background-attachment: fixed;
    color: #ffffff;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 18px;
  }
  .brand img {
    height: 18px;
    width: auto;
    display: block;
  }
  .brand .wordmark {
    font-size: 15px;
    letter-spacing: -0.2px;
  }
  .brand .wordmark b { font-weight: 700; }
  .brand .wordmark span { font-weight: 300; color: #b8babf; }

  section + section {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .section-label {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color: #888b91;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin: 0 0 12px 0;
  }

  /* --- Navegador de Looks: tira de numeros, sin miniaturas ---
     Flexbox + scroll horizontal; nada de CSS Grid ni aspect-ratio (este
     runtime de UXP no soporta bien CSS moderno -- ver notas abajo). */
  #lookStrip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .look-num {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: transparent;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
    color: #b8babf;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .look-num:hover { box-shadow: inset 0 0 0 1px #4a6cf0; color: #ffffff; }
  .look-num.selected {
    background: #4a6cf0;
    box-shadow: none;
    color: #ffffff;
    font-weight: 500;
  }
  .look-num:focus-visible { outline: 2px solid #4a6cf0; outline-offset: 1px; }

  #lookReadout {
    margin-top: 14px;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.4px;
  }
  #lookReadout .idx { color: #4a6cf0; font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; font-weight: 500; margin-right: 8px; }

  /* --- Deslizador de Intensity (construido a mano: el <input type="range">
     nativo se traba al arrastrarlo en este runtime de UXP). Track fino con
     degrade de marca (senal -> arena); una mascara oscura cubre la parte
     todavia no "revelada" a la derecha del thumb. --- */
  .control-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .control-row label {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #888b91;
  }
  .intensity-value {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    font-size: 13px;
    min-width: 30px;
    text-align: right;
    cursor: text;
    border-bottom: 1px dashed transparent;
  }
  .intensity-value:hover,
  .intensity-value:focus {
    border-bottom-color: #4a6cf0;
    outline: none;
  }
  #intensitySlider,
  .basic-slider {
    position: relative;
    height: 20px;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: none;
  }
  /* Los cinco de "Basic Adjustments" van apilados uno tras otro: sin este
     margen, el siguiente control-row quedaria pegado al thumb anterior. */
  .basic-slider { margin-bottom: 14px; }

  #intensitySlider .track,
  .basic-slider .track {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, #203252 0%, #4a6cf0 55%, #f0cca4 100%);
  }
  #intensitySlider .mask,
  .basic-slider .mask {
    position: absolute;
    right: 0;
    height: 2px;
    border-radius: 0 2px 2px 0;
    background: #16233a;
    width: 0%;
  }
  #intensitySlider .thumb,
  .basic-slider .thumb {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    left: 100%;
    transform: translateX(-50%);
    box-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  #intensitySlider.dragging .thumb,
  .basic-slider.dragging .thumb { background: #dfe6ff; }

  button {
    width: 100%;
    padding: 9px 0;
    margin-top: 4px;
    border: 0;
    border-radius: 9px;
    background: #1c1d1f;
    color: #ffffff;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  button:hover { background: #26282b; }
  button.primary { background: #ffffff; color: #001b33; box-shadow: none; }
  button.primary:hover { background: #e9edf5; }
  button.subtle {
    background: none;
    color: #b8babf;
    box-shadow: none;
    font-weight: 400;
    padding: 6px 0;
  }
  button.subtle:hover { color: #ffffff; }

  #status {
    margin-top: 10px;
    font-size: 10.5px;
    color: #888b91;
    min-height: 13px;
  }
  #status.error { color: #ff9b8a; }
  #status.warn { color: #f0cca4; }
  #status.ok { color: #ffffff; }

  details#diagnostics summary {
    cursor: pointer;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #888b91;
  }
  #log {
    margin-top: 8px;
    padding: 8px;
    height: 120px;
    overflow-y: auto;
    background: #0f0f10;
    border-radius: 8px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="./assets/brand/colorlab-mark.png" alt="" />
    <span class="wordmark"><b>Color</b><span>Lab</span></span>
  </div>

  <section>
    <div class="section-label">Look</div>
    <div id="lookStrip"></div>
    <div id="lookReadout"><span class="idx" id="lookIndexLabel">01</span><span id="lookNameLabel">Nature</span></div>
  </section>

  <section>
    <div class="control-row">
      <label for="intensitySlider">Intensity</label>
      <span class="intensity-value" id="intensityValue" tabindex="0" title="Haz clic para escribir un valor">100.0</span>
    </div>
    <div id="intensitySlider">
      <div class="track"></div>
      <div class="mask" id="intensityMask"></div>
      <div class="thumb" id="intensityThumb"></div>
    </div>
  </section>

  <section>
    <div class="section-label">Basic Adjustments</div>

    <div class="control-row">
      <label for="exposureSlider">Exposure</label>
      <span class="intensity-value" id="exposureValue" tabindex="0" title="Haz clic para escribir un valor">0.00</span>
    </div>
    <div id="exposureSlider" class="basic-slider">
      <div class="track"></div>
      <div class="mask" id="exposureMask"></div>
      <div class="thumb" id="exposureThumb"></div>
    </div>

    <div class="control-row">
      <label for="contrastSlider">Contrast</label>
      <span class="intensity-value" id="contrastValue" tabindex="0" title="Haz clic para escribir un valor">0.0</span>
    </div>
    <div id="contrastSlider" class="basic-slider">
      <div class="track"></div>
      <div class="mask" id="contrastMask"></div>
      <div class="thumb" id="contrastThumb"></div>
    </div>

    <div class="control-row">
      <label for="temperatureSlider">Temperature</label>
      <span class="intensity-value" id="temperatureValue" tabindex="0" title="Haz clic para escribir un valor">0.0</span>
    </div>
    <div id="temperatureSlider" class="basic-slider">
      <div class="track"></div>
      <div class="mask" id="temperatureMask"></div>
      <div class="thumb" id="temperatureThumb"></div>
    </div>

    <div class="control-row">
      <label for="tintSlider">Tint</label>
      <span class="intensity-value" id="tintValue" tabindex="0" title="Haz clic para escribir un valor">0.0</span>
    </div>
    <div id="tintSlider" class="basic-slider">
      <div class="track"></div>
      <div class="mask" id="tintMask"></div>
      <div class="thumb" id="tintThumb"></div>
    </div>

    <div class="control-row">
      <label for="saturationSlider">Saturation</label>
      <span class="intensity-value" id="saturationValue" tabindex="0" title="Haz clic para escribir un valor">100.0</span>
    </div>
    <div id="saturationSlider" class="basic-slider">
      <div class="track"></div>
      <div class="mask" id="saturationMask"></div>
      <div class="thumb" id="saturationThumb"></div>
    </div>
  </section>

  <section>
    <button id="btnApply" class="primary">Aplicar al clip seleccionado</button>
    <div id="status"></div>
  </section>

  <section>
    <details id="diagnostics">
      <summary>Diagnostico</summary>
      <button id="btnDiagnose" class="subtle">Listar efectos y clip seleccionado</button>
      <div id="log"></div>
    </details>
  </section>

  <script src="./main.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Color Lab</title>
<style>
  /*
   * Tokens del sistema de marca de Color Lab (variante original, no la
   * aguamarina):
   *   #000000  vacio / lienzo        #0f0f10  obsidiana / tarjeta
   *   #1c1d1f  carbon / controles    #001b33  marino -- "panel del plug-in"
   *   #4a6cf0  senal -- acento       #f0cca4  arena -- acento calido
   *   #ffffff  blanco -- "la accion" #b8babf  niebla -- texto de apoyo
   *   #888b91  ceniza -- terciario
   * Tipografia: Inter (UI) + JetBrains Mono (labels tecnicos). Sin
   * bundlear webfonts: cae a la fuente del sistema si no estan instaladas.
   */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  /* Este runtime de UXP aplica el estilo NATIVO del boton (pildora gris
     del SO) a cualquier <button> salvo que se pida "appearance: none"
     explicitamente -- a diferencia de un navegador normal. Hallazgo en
     vivo, probando en Premiere real. */
  button {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    font: inherit;
    color: inherit;
    text-align: inherit;
  }
  html, body { height: 100%; }
  /* EL DESPLAZAMIENTO VA EN #app, NO EN EL BODY.
     Con las secciones desplegadas el contenido supera la altura del panel y
     la rueda del raton no hacia nada: este runtime de UXP no desplaza el
     <body>. Un contenedor absoluto que llena el panel con overflow-y: auto
     si desplaza. (22 oct, hallazgo en Premiere real.) */
  #app {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 34px;   /* deja sitio a la firma, fija abajo */
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
  }
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: "Inter", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    /* Escala de grises (22 oct): el degradado azul se confundia con el
       color de los controles. El azul "Senal" se queda solo como acento. */
    background: linear-gradient(160deg, #000000 0%, #121212 45%, #2b2b2b 100%);
    background-attachment: fixed;
    color: #ffffff;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 18px;
  }
  .brand img {
    height: 18px;
    width: auto;
    display: block;
  }
  .brand .wordmark {
    font-size: 15px;
    letter-spacing: -0.2px;
  }
  .brand .wordmark b { font-weight: 700; }
  .brand .wordmark span { font-weight: 300; color: #b8babf; }

  section + section {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .section-label {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color: #888b91;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin: 0 0 12px 0;
  }

  /* --- Navegador de Looks: tira de numeros, sin miniaturas ---
     Flexbox + scroll horizontal; nada de CSS Grid ni aspect-ratio (este
     runtime de UXP no soporta bien CSS moderno -- ver notas abajo). */
  #lookStrip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  /* LOS NUMEROS SON <div>, NO <button>, Y ES OBLIGATORIO.
     Este runtime de UXP sigue pintando el fondo nativo del boton aunque se
     le pida "appearance: none" -- con <button> el recuadro salia gris y el
     fondo blanco del seleccionado se quedaba en un simple trazo. Un <div>
     no tiene apariencia nativa que pelear. El rol de boton y el foco de
     teclado se reponen con role/tabindex y un handler de Enter/Espacio en
     main.js.
     Por lo mismo el contorno va en `border` y no en `box-shadow: inset`:
     tampoco esta verificado que este runtime lo soporte. */
  .look-num {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background-color: transparent;
    border: 1px solid rgba(255,255,255,0.18);
    color: #b8babf;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .look-num:hover { border-color: #4a6cf0; color: #ffffff; }
  /* El Look PUESTO va en blanco: es el maximo contraste sobre el fondo
     oscuro y se localiza de un vistazo entre los quince numeros. El azul
     Senal se queda para el hover y el foco de teclado, que son estados
     pasajeros; asi el blanco significa una sola cosa en esta tira. */
  .look-num.selected {
    background-color: #ffffff;
    border-color: #ffffff;
    color: #001b33;
    font-weight: 500;
  }
  .look-num:focus-visible { outline: 2px solid #4a6cf0; outline-offset: 1px; }

  #lookReadout {
    margin-top: 14px;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.4px;
  }
  /* El numero del nombre acompana al color del recuadro seleccionado: si
     se quedara azul, seria el unico resto de un color que ya no significa
     "seleccionado" en ningun otro sitio de la tira. */
  #lookReadout .idx { color: #ffffff; font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; font-weight: 500; margin-right: 8px; }

  /* --- Deslizador de Intensity (construido a mano: el <input type="range">
     nativo se traba al arrastrarlo en este runtime de UXP). Track fino con
     degrade de marca (senal -> arena); una mascara oscura cubre la parte
     todavia no "revelada" a la derecha del thumb. --- */
  .control-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .control-row label {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #888b91;
  }
  .intensity-value,
  .slider-value {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    font-size: 13px;
    min-width: 30px;
    text-align: right;
    cursor: text;
    border-bottom: 1px dashed transparent;
  }
  .intensity-value:hover,
  .intensity-value:focus,
  .slider-value:hover,
  .slider-value:focus {
    border-bottom-color: #4a6cf0;
    outline: none;
  }
  .slider {
    position: relative;
    height: 20px;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: none;
  }
  .slider .track {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, #203252 0%, #4a6cf0 55%, #f0cca4 100%);
  }
  .slider .mask {
    position: absolute;
    right: 0;
    height: 2px;
    border-radius: 0 2px 2px 0;
    background: #1b1b1d;
    width: 0%;
  }
  .slider .thumb {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    left: 100%;
    transform: translateX(-50%);
    box-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .slider.dragging .thumb { background: #dfe6ff; }


  /* --- Secciones plegables: Split Tone, Bloom, Halation, Film Grain ---
     Cabecera = <div role="button"> (nunca <button>, ver arriba); el
     interruptor de activar es otro <div role="switch">. */
  /* Cada herramienta es una tarjeta: fondo apenas mas claro y borde de 1px.
     Separa sin lineas gruesas. El titulo es el texto MAS GRANDE de la
     tarjeta; las etiquetas de dentro son mono diminutas -- asi no compiten. */
  .tool {
    background-color: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px;
    margin-top: 10px;
    padding: 0 14px;
  }
  .tool-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .tool-title {
    font-family: "Inter", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.1px;
    color: #d9dadd;
  }
  .tool-title .chev { display: inline-block; width: 14px; color: #888b91; font-weight: 400; }
  .tool.on .tool-title { color: #ffffff; }
  .switch {
    width: 30px;
    height: 16px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25);
    background-color: transparent;
    position: relative;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .switch .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: #888b91;
  }
  .switch.on { background-color: #ffffff; border-color: #ffffff; }
  .switch.on .knob { left: 16px; background-color: #001b33; }
  .switch:focus-visible, .tool-head:focus-visible { outline: 2px solid #4a6cf0; outline-offset: 1px; }
  .tool-body { padding: 0 0 16px 0; }
  .tool-body.hidden { display: none; }
  .tool:not(.on) .tool-body .control-row,
  .tool:not(.on) .tool-body .slider { opacity: 0.45; }
  .tool-body .control-row { margin-top: 8px; margin-bottom: 4px; }
  .tint-preview {
    height: 10px;
    border-radius: 5px;
    margin: 10px 0 0 0;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .warn-box { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(240,204,164,0.35); background: rgba(240,204,164,0.07); }
  .warn-text { flex: 1; font-size: 10.5px; line-height: 1.4; color: #f0cca4; }
  .warn-text b { font-weight: 600; }
  .warn-action { padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(240,204,164,0.5); color: #f0cca4; font-size: 11px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .warn-action:hover { background: rgba(240,204,164,0.15); }
  .camera-hint { margin-top: 8px; font-size: 10.5px; color: #8a8d93; line-height: 1.35; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip {
    padding: 5px 9px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.18);
    color: #b8babf;
    font-size: 11px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .chip:hover { border-color: #4a6cf0; color: #ffffff; }
  .chip.selected { background-color: #ffffff; border-color: #ffffff; color: #001b33; font-weight: 500; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.18);
    cursor: pointer;
  }
  .swatch:hover { border-color: #4a6cf0; }
  .swatch.selected { border-color: #ffffff; }
  .chip:focus-visible, .swatch:focus-visible { outline: 2px solid #4a6cf0; outline-offset: 1px; }
  .tool:not(.on) .tool-body .chips,
  .tool:not(.on) .tool-body .swatches { opacity: 0.45; }
  .check-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #888b91;
  }

  /* Aplicar / Restaurar: <div role="button"> por la misma razon que los
     numeros de Look (este runtime pinta <button> con el aspecto del SO). */
  /* Firma de la marca madre. Fija al pie del panel (fuera del area que se
     desplaza) para que este siempre a la vista pero sin competir: "by:" en
     mono diminuto (el sistema), "jocsankleyver" en serif minusculas, gris
     claro (el logotipo de la marca madre). La fuente serif no se empaqueta:
     si "Cormorant Garamond"/"Playfair Display" no estan instaladas cae a
     Georgia. */
  #signature {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #signature .by {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: #6d7076;
    margin-right: 6px;
  }
  #signature .jk {
    font-family: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: #b8babf;
  }

  .btn-row { display: flex; gap: 8px; margin-top: 4px; }
  .btn {
    flex: 1 1 0;
    height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .btn.primary { background-color: #ffffff; color: #001b33; border: 1px solid #ffffff; }
  .btn.primary:hover { background-color: #e9edf5; }
  .btn.secondary { background-color: transparent; color: #d9dadd; border: 1px solid rgba(255,255,255,0.22); }
  .btn.secondary:hover { border-color: #ffffff; color: #ffffff; }
  .btn.disabled { opacity: 0.45; pointer-events: none; }
  .btn:focus-visible { outline: 2px solid #4a6cf0; outline-offset: 1px; }

  button {
    width: 100%;
    padding: 9px 0;
    margin-top: 4px;
    border: 0;
    border-radius: 9px;
    background: #1c1d1f;
    color: #ffffff;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  button:hover { background: #26282b; }
  button.primary { background: #ffffff; color: #001b33; box-shadow: none; }
  button.primary:hover { background: #e9edf5; }
  button.subtle {
    background: none;
    color: #b8babf;
    box-shadow: none;
    font-weight: 400;
    padding: 6px 0;
  }
  button.subtle:hover { color: #ffffff; }

  #status {
    margin-top: 10px;
    font-size: 10.5px;
    color: #888b91;
    min-height: 13px;
  }
  #status.error { color: #ff9b8a; }
  #status.warn { color: #f0cca4; }
  #status.ok { color: #ffffff; }

  details#diagnostics summary {
    cursor: pointer;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #888b91;
  }
  #log {
    margin-top: 8px;
    padding: 8px;
    height: 120px;
    overflow-y: auto;
    background: #0f0f10;
    border-radius: 8px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div id="app">
  <div class="brand" id="brand" title="">
    <img src="./assets/brand/colorlab-mark.png" alt="" />
    <span class="wordmark"><b>Color</b><span>Lab</span></span>
  </div>

  <section id="bitDepthWarn" style="display:none">
    <div class="warn-box">
      <div class="warn-text">La secuencia no usa <b>Profundidad de bits máxima</b>: Premiere procesa a 8 bits y puede verse banding en degradados.</div>
      <div id="btnBitDepth" class="warn-action" role="button" tabindex="0">Activar</div>
    </div>
  </section>

  <section>
    <div class="section-label">Camera</div>
    <div id="cameraChips" class="chips"></div>
    <div id="cameraHint" class="camera-hint">Convierte tu material log a Rec.709 antes del Look.</div>
  </section>

  <section>
    <div class="section-label">Look</div>
    <div id="lookStrip"></div>
    <div id="lookReadout"><span class="idx" id="lookIndexLabel">01</span><span id="lookNameLabel">Nature</span></div>
  </section>

  <section>
    <div class="control-row">
      <label for="intensitySlider">Intensity</label>
      <span class="intensity-value" id="intensityValue" tabindex="0" title="Haz clic para escribir un valor">100.0</span>
    </div>
    <div id="intensitySlider" class="slider">
      <div class="track"></div>
      <div class="mask" id="intensityMask"></div>
      <div class="thumb" id="intensityThumb"></div>
    </div>
  </section>

  <section id="toolSections" style="padding-top:0;border-top:0;margin-top:14px"></section>

  <section>
    <div class="btn-row">
      <div id="btnApply" class="btn primary" role="button" tabindex="0" title="Aplica los valores del panel al clip seleccionado">Aplicar</div>
      <div id="btnRestore" class="btn secondary" role="button" tabindex="0" title="Quita Color Lab del clip seleccionado">Restaurar</div>
    </div>
    <div id="status"></div>
  </section>

  <!-- Diagnostico: oculto para el usuario. Lo necesita soporte (fue lo que
       permitio encontrar los fallos de lectura del 21 oct). Se muestra con
       Alt/Opcion + clic sobre el logotipo. -->
  <section id="diagnosticsSection" style="display:none">
    <details id="diagnostics">
      <summary>Diagnostico</summary>
      <button id="btnDiagnose" class="subtle">Listar efectos y clip seleccionado</button>
      <div id="log"></div>
    </details>
  </section>

  </div>

  <div id="signature"><span class="by">by:</span><span class="jk">jocsankleyver</span></div>

  <script src="./main.js"></script>
</body>
</html>
